<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hueco Mundo 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden; font-family: system-ui, sans-serif; color: #e8eef5; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 16px; bottom: 16px; right: 16px; max-width: 420px; padding: 12px 14px; background: #0b0e14cc; border: 1px solid #1a2230; border-radius: 10px; font-size: 14px; line-height: 1.4; }
  #hud b { color: #e0455a; }
  #hud label { display: inline-block; margin-top: 8px; padding: 6px 10px; background: #151b26; border: 1px solid #1a2230; border-radius: 6px; cursor: pointer; }
  #hud label:focus-within { outline: 2px solid #8fd3ff; }
  #hud input { position: absolute; opacity: 0; width: 1px; height: 1px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.0/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<div id="hud" role="status" aria-live="polite">
  <b>Hueco Mundo 3D</b> — arraste um arquivo <code>.vrm</code> aqui, ou use <code>?vrm=URL</code>. Clique para disparar um <b>Cero</b>.
  <br><label>Escolher .vrm <input id="file" type="file" accept=".vrm"></label>
  <div id="msg"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
